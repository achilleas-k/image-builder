name_aliases: [container]
filename: container.oci.tar
mime_type: application/x-tar
image_func: container
bootable: false
exports: [container]
required_partition_sizes:
  /: 1 GiB
  /usr: 2 GiB

platforms:
  - arch: x86_64
  - arch: aarch64
  - arch: ppc64le
  - arch: s390x
  - arch: riscv64
image_config:
  no_selinux: true
  exclude_docs: true
  locale: C.UTF-8
  timezone: Etc/UTC
  oci:
    archive:
      env:
        - PATH=/usr/local/bin:/usr/bin
        - container=oci
      cmd:
        - /bin/bash
      working_dir: /
      labels:
        license: MIT
        name: fedora
        vendor: Fedora Project
        org.opencontainers.image.license: MIT
        org.opencontainers.image.name: fedora
        org.opencontainers.image.url: https://fedoraproject.org/
        org.opencontainers.image.vendor: Fedora Project
package_sets:
  os:
    - include:
        - bash
        - coreutils
        - yum
        - dnf
        - fedora-release-container
        - glibc-minimal-langpack
        - rootfiles
        - rpm
        - sudo
        - tar
        - util-linux-core
        - vim-minimal
      exclude:
        - crypto-policies-scripts
        - dbus-broker
        - deltarpm
        - dosfstools
        - e2fsprogs
        - elfutils-debuginfod-client
        - fuse-libs
        - gawk-all-langpacks
        - glibc-gconv-extra
        - glibc-langpack-en
        - gnupg2-smime
        - grubby
        - kernel-core
        - kernel-debug-core
        - kernel
        - langpacks-en_GB
        - langpacks-en
        - libss
        - libxcrypt-compat
        - nano
        - openssl-pkcs11
        - pinentry
        - python3-unbound
        - shared-mime-info
        - sssd-client
        - sudo-python-plugin
        - systemd
        - trousers
        - whois-nls
        - xkeyboard-config
blueprint:
  supported_options:
    - distro
    - packages
    - modules
    - groups
    - enabled_modules
    - containers
    - customizations.cacerts
    - customizations.directories
    - customizations.files
    - customizations.firewall
    - customizations.firstboot
    - customizations.user
    - customizations.sshkey
    - customizations.group
    - customizations.hostname
    - customizations.locale
    - customizations.repositories
    - customizations.services
    - customizations.timezone

    # options supported by ostree disk (deployment) image types
