name_aliases: [vmdk, vsphere]
filename: disk.vmdk
mime_type: application/x-vmdk
bootable: true
default_size: 2 GiB
image_func: disk
exports: [vmdk]
required_partition_sizes:
  /: 1 GiB
  /usr: 2 GiB

platforms:
  - <<:
      <<:
        arch: x86_64
        uefi_vendor: fedora
        qcow2_compat: '1.1'
        packages: &x86_64_uefi_platform_packages
          uefi:
            - dracut-config-generic
            - efibootmgr
            - grub2-efi-x64
            - shim-x64
        bootloader: grub2
      bios_platform: i386-pc
      packages:
        <<: *x86_64_uefi_platform_packages
        bios:
          - dracut-config-generic
          - grub2-pc
      build_packages:
        bios:
          - grub2-pc
      bootloader: grub2
    # XXX: the name is not 100% accurate, this platform is also used for iot-container, iot-commit
    image_format: vmdk
image_config:
  locale: en_US.UTF-8
  conditions:
    f42 and below cloud init service names:
      when:
        version_less_than: '43'
      shallow_merge:
        enabled_services:
          - cloud-init.service
          - cloud-config.service
          - cloud-final.service
          - cloud-init-local.service

    f43 and above new cloud init service names:
      when:
        version_greater_or_equal: '43'
      shallow_merge:
        enabled_services:
          - cloud-init-network.service
          - cloud-config.service
          - cloud-final.service
          - cloud-init-local.service

  kernel_options:
    - console=tty1
    - console=ttyS0,115200n8
    - earlyprintk=ttyS0
    - systemd.firstboot=off
partition_table:
  <<:
    x86_64:
      uuid: D209C89E-EA5E-4FBD-B161-B461CCE297E0
      type: gpt
      partitions:
        - size: 1 MiB
          bootable: true
          type: &bios_boot_partition_guid 21686148-6449-6E6F-744E-656564454649
        - &default_partition_table_part_efi
          size: 200 MiB
          type: &efi_system_partition_guid C12A7328-F81F-11D2-BA4B-00A0C93EC93B
          payload_type: filesystem
          payload:
            type: vfat
            mountpoint: /boot/efi
            label: ESP
            fstab_options: defaults,uid=0,gid=0,umask=077,shortname=winnt
            fstab_freq: 0
            fstab_passno: 2
        - &default_partition_table_part_boot
          size: 2 GiB
          type: &filesystem_data_guid 0FC63DAF-8483-4772-8E79-3D69D8477DE4
          payload_type: filesystem
          payload:
            type: ext4
            mountpoint: /boot
            label: boot
            fstab_options: defaults
            fstab_freq: 0
            fstab_passno: 0
        - &default_partition_table_part_root
          size: 2 GiB
          type: *filesystem_data_guid
          payload_type: filesystem
          payload:
            type: ext4
            label: root
            mountpoint: /
            fstab_options: defaults
            fstab_freq: 0
            fstab_passno: 0
      # iot partitions
    aarch64: &default_partition_table_aarch64
      uuid: D209C89E-EA5E-4FBD-B161-B461CCE297E0
      type: gpt
      partitions:
        - *default_partition_table_part_efi
        - *default_partition_table_part_boot
        - *default_partition_table_part_root
    ppc64le:
      uuid: '0x14fc63d2'
      type: dos
      partitions:
        - size: 4 MiB
          bootable: true
          type: &prep_partition_dosid '41'
        - &default_partition_table_part_boot_ppc64le
          size: 2 GiB
          payload_type: filesystem
          payload:
            type: ext4
            mountpoint: /boot
            label: boot
            fstab_options: defaults
            fstab_freq: 0
            fstab_passno: 0
        - &default_partition_table_part_root_ppc64le
          size: 2 GiB
          payload_type: filesystem
          payload:
            type: ext4
            mountpoint: /
            fstab_options: defaults
            fstab_freq: 0
            fstab_passno: 0
    s390x:
      uuid: '0x14fc63d2'
      type: dos
      partitions:
        - *default_partition_table_part_boot_ppc64le
        - <<: *default_partition_table_part_root_ppc64le
          bootable: true
    riscv64: *default_partition_table_aarch64
package_sets:
  os:
    - include:
        - '@Fedora Cloud Server'
        - chrony
        - systemd-udev
        - langpacks-en
        - open-vm-tools
      exclude:
        - dracut-config-rescue
        - etables
        - firewalld
        - geolite2-city
        - geolite2-country
        - gobject-introspection
        - plymouth
        - zram-generator-defaults
        - grubby-deprecated
        - extlinux-bootloader
blueprint:
  supported_options:
    - distro
    - packages
    - modules
    - groups
    - enabled_modules
    - containers
    - customizations.cacerts
    - customizations.directories
    - customizations.disk
    - customizations.files
    - customizations.filesystem
    - customizations.firstboot
    - customizations.partitioning_mode
    - customizations.fips
    - customizations.firewall
    - customizations.user
    - customizations.sshkey
    - customizations.group
    - customizations.hostname
    - customizations.kernel
    - customizations.locale
    - customizations.openscap
    - customizations.repositories
    - customizations.rpm
    - customizations.services
    - customizations.timezone
    - customizations.sshd

    # options supported by base ostree image types (commit and container)
