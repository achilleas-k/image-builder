filename: disk.qcow2
mime_type: application/x-qemu-disk
bootable: true
default_size: 10 GiB
image_func: disk
exports: [qcow2]
required_partition_sizes:
  /: 1 GiB
  /usr: 2 GiB

partition_table:
  <<:
    x86_64:
      type: gpt
      partitions:
        - <<:
            size: 1 MiB
            bootable: true
            type: &bios_boot_partition_guid 21686148-6449-6E6F-744E-656564454649
          size: 2 MiB
        - &server_partition_table_part_efi
          <<:
            size: 200 MiB
            type: &efi_system_partition_guid 
              C12A7328-F81F-11D2-BA4B-00A0C93EC93B
            payload_type: filesystem
            payload:
              type: vfat
              mountpoint: /boot/efi
              label: ESP
              fstab_options: defaults,uid=0,gid=0,umask=077,shortname=winnt
              fstab_freq: 0
              fstab_passno: 2
          size: 500 MiB
        - &server_partition_table_part_boot
          <<:
            size: 2 GiB
            type: &filesystem_data_guid 0FC63DAF-8483-4772-8E79-3D69D8477DE4
            payload_type: filesystem
            payload: &default_partition_table_part_boot_payload
              type: ext4
              mountpoint: /boot
              label: boot
              fstab_options: defaults
              fstab_freq: 0
              fstab_passno: 0
          type: &xboot_ldr_partition_guid BC13C2FF-59E6-4262-A352-B275FD6F7172
          payload:
            <<: *default_partition_table_part_boot_payload
            type: xfs
        - &server_partition_table_part_root
          type: &lvm_partition_guid E6D6D379-F507-44C2-A23C-238F2A3DF928
          payload_type: lvm
          payload:
            name: systemVG
            description: built with lvm2
            logical_volumes:
              - size: 3 GiB
                name: LVroot
                payload_type: filesystem
                payload:
                  type: xfs
                  label: root
                  mountpoint: /
                  fstab_options: defaults

      # Fedora Cloud uses BTRFS and ext4 boot
    aarch64:
      type: gpt
      partitions:
        - *server_partition_table_part_efi
        - *server_partition_table_part_boot
        - *server_partition_table_part_root
    ppc64le:
      type: gpt
      partitions:
        - size: 8 MiB
          type: &prep_boot_partition_guid 21686148-6449-6E6F-744E-656564454649
        - *server_partition_table_part_boot
        - *server_partition_table_part_root
    s390x:
      type: dos
      partitions:
        - <<: *server_partition_table_part_boot
          type: &filesystem_linux_dosid '83'
        - <<: *server_partition_table_part_root
          type: &filesystem_linux_lvm_dosid 8e

package_sets:
  os:
    - include:
        - '@server-product-environment'
        - '@domain-client'
        - glibc-all-langpacks
        - initial-setup
        - lvm2
        - xfsprogs
      exclude:
        - initial-setup-gui
        - plymouth

    - include:
        - '@guest-agents'
      exclude:
        - dracut-config-rescue
        - '*-firmware'
        - smartmontools
        - smartmontools-selinux

platforms:
  - <<:
      <<:
        arch: x86_64
        uefi_vendor: fedora
        qcow2_compat: '1.1'
        packages: &x86_64_uefi_platform_packages
          uefi:
            - dracut-config-generic
            - efibootmgr
            - grub2-efi-x64
            - shim-x64
        bootloader: grub2
      bios_platform: i386-pc
      packages:
        <<: *x86_64_uefi_platform_packages
        bios:
          - dracut-config-generic
          - grub2-pc
      build_packages:
        bios:
          - grub2-pc
      bootloader: grub2
    # XXX: the name is not 100% accurate, this platform is also used for iot-container, iot-commit
    image_format: qcow2
  - <<:
      arch: aarch64
      uefi_vendor: fedora
      image_format: qcow2
      qcow2_compat: '1.1'
      packages:
        uefi:
          - dracut-config-generic
          - efibootmgr
          - grub2-efi-aa64
          - grub2-tools
          - shim-aa64
      bootloader: grub2
    image_format: qcow2
  - <<:
      arch: ppc64le
      bios_platform: powerpc-ieee1275
      image_format: qcow2
      qcow2_compat: '1.1'
      packages:
        bios:
          - dracut-config-generic
          - powerpc-utils
          - grub2-ppc64le
          - grub2-ppc64le-modules
      build_packages:
        bios:
          - grub2-ppc64le
          - grub2-ppc64le-modules
      bootloader: grub2
    image_format: qcow2
  - <<:
      arch: s390x
      zipl_support: true
      image_format: qcow2
      qcow2_compat: '1.1'
      packages:
        zipl:
          - dracut-config-generic
          - s390utils-base
          - s390utils-core
      build_packages:
        zipl:
          - s390utils-base
      bootloader: zipl
    image_format: qcow2
image_config:
  default_kernel: kernel-core
  kernel_options:
    - no_timer-check
    - console=tty1
    - console=ttyS0,115200n8
  enabled_services:
    - initial-setup.service
  files:
        # Triggers Anaconda's initial-setup to reconfigure the system when it
        # boots the first time.
    - path: /etc/reconfigSys
      user: root
      group: root
      data: ''
  lock_root_user: true
blueprint:
  supported_options:
    - distro
    - packages
    - modules
    - groups
    - enabled_modules
    - containers
    - customizations.cacerts
    - customizations.directories
    - customizations.disk
    - customizations.files
    - customizations.filesystem
    - customizations.firstboot
    - customizations.partitioning_mode
    - customizations.fips
    - customizations.firewall
    - customizations.user
    - customizations.sshkey
    - customizations.group
    - customizations.hostname
    - customizations.kernel
    - customizations.locale
    - customizations.openscap
    - customizations.repositories
    - customizations.rpm
    - customizations.services
    - customizations.timezone
    - customizations.sshd

    # options supported by base ostree image types (commit and container)
