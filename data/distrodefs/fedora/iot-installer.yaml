<<:
  supported_partitioning_modes:
    - ''    # empty string means default partitioning mode
    - auto-lvm
    - lvm

name_aliases: [fedora-iot-installer]
filename: installer.iso
mime_type: application/x-iso9660-image
boot_iso: true
image_func: ostree_installer
iso_label: IoT
variant: IoT
ostree:
  name: fedora-iot
  remote_name: fedora-iot
  ref: &ostree_iot_ref '{{.Distro.Name}}/{{.Distro.MajorVersion}}/{{.Arch}}/iot'
  url: mirrorlist=https://ostree.fedoraproject.org/iot/mirrorlist

exports: [bootiso]
required_partition_sizes:
  /: 1 GiB
  /usr: 2 GiB

installer_config:
  <<:
    enabled_anaconda_modules:
      - org.fedoraproject.Anaconda.Modules.Localization
      - org.fedoraproject.Anaconda.Modules.Network
      - org.fedoraproject.Anaconda.Modules.Payloads
      - org.fedoraproject.Anaconda.Modules.Runtime
      - org.fedoraproject.Anaconda.Modules.Storage
      - org.fedoraproject.Anaconda.Modules.Timezone
      - org.fedoraproject.Anaconda.Modules.Users
    additional_dracut_modules:
      - net-lib
      - dbus-broker
    default_menu: 1
    install_weak_deps: true
    conditions:
      below fedora 45 we use lorax:
        when:
          version_less_than: '45'
        shallow_merge:
          lorax_template_package: lorax-templates-generic
          lorax_templates:
            - path: 99-generic/runtime-postinstall.tmpl
            - path: 99-generic/runtime-cleanup.tmpl
              after_dracut: true
          lorax_logos_package: fedora-logos
          lorax_release_package: fedora-release


  default_menu: 0
iso_config:
  <<:
    preparer: image-builder - https://osbuild.org/
    publisher: Fedora Project
    rootfs_type: squashfs
    rootfs_excludes:
      - boot/efi/.*
      - boot/grub2/.*
      - boot/config-.*
      - boot/initramfs-.*
      - boot/loader/.*
      - boot/symvers-.*
      - boot/System.map-.*

    conditions: &default_iso_config_conditions
      x86_64 uses grub2:
        when:
          arch: x86_64
        shallow_merge:
          boot_type: grub2
      fedora 45 and up exclude efiboot.img on x86:
        when:
          version_greater_or_equal: '45'
          arch: x86_64
        shallow_merge:
          exclude_paths:
            - efiboot.img
      ppc64le uses grub2-ppc64le:
        when:
          arch: ppc64le
        shallow_merge:
          boot_type: grub2-ppc64le
      s390x uses s390-iso:
        when:
          arch: s390x
        shallow_merge:
          boot_type: s390-iso
      fedora < 45 excludes metadata:
        when:
          version_less_than: '45'
        shallow_merge:
          rootfs_excludes:
            - boot/efi/.*
            - boot/grub2/.*
            - boot/config-.*
            - boot/initramfs-.*
            - boot/loader/.*
            - boot/symvers-.*
            - boot/System.map-.*
            - usr/lib/sysimage/rpm/.*
            - var/lib/rpm/.*
            - var/lib/yum/.*
            - var/lib/dnf/.*

  conditions:
    <<: *default_iso_config_conditions
    f45 and above use erofs:
      when:
        version_greater_or_equal: '45'
      shallow_merge:
        rootfs_type: erofs
        erofs_options:
          compression:
            method: lzma
            level: 6
          options:
            - fragments
          cluster-size: 1048576

image_config:
  <<:
    enabled_services:
      - NetworkManager.service
      - firewalld.service
      - sshd.service
      - greenboot-grub2-set-counter
      - greenboot-grub2-set-success
      - greenboot-healthcheck
      - greenboot-rpm-ostree-grub2-check-fallback
      - greenboot-status
      - greenboot-task-runner
      - redboot-auto-reboot
      - redboot-task-runner
      - bootloader-update
    kernel_options:
      - rw
      - coreos.no_persist_ip

    conditions:
      f43 uses new greenboot:
        when:
          version_greater_or_equal: '43'
        shallow_merge:
          enabled_services:
            - NetworkManager.service
            - firewalld.service
            - sshd.service
            - greenboot-healthcheck
            - bootloader-update

  locale: en_US.UTF-8
      # iot-installer is not using the default ostree kernel options
  kernel_options:
package_sets:
  installer:
    - include:
        - aajohan-comfortaa-fonts
        - abattis-cantarell-fonts
        - alsa-firmware
        - alsa-tools-firmware
        - anaconda
        - anaconda-dracut
        - anaconda-install-img-deps
        - atheros-firmware
        - audit
        - bind-utils
        - bitmap-fangsongti-fonts
        - brcmfmac-firmware
        - bzip2
        - cryptsetup
        - curl
        - dbus-x11
        - dejavu-sans-fonts
        - dejavu-sans-mono-fonts
        - device-mapper-persistent-data
        - dnf
        - dracut-config-generic
        - dracut-network
        - ethtool
        - fcoe-utils
        - ftp
        - gdb-gdbserver
        - gdisk
        - glibc-all-langpacks
        - gnome-kiosk
        - google-noto-sans-cjk-ttc-fonts
        - grubby
        - gsettings-desktop-schemas
        - hdparm
        - hexedit
        - hostname
        - initscripts
        - ipmitool
        - iwlwifi-dvm-firmware
        - iwlwifi-mvm-firmware
        - jomolhari-fonts
        - kacst-farsi-fonts
        - kacst-qurn-fonts
        - kbd
        - kbd-misc
        - kdump-anaconda-addon
        - kernel
        - khmeros-base-fonts
        - less
        - libblockdev-lvm-dbus
        - libibverbs
        - libreport-plugin-bugzilla
        - libreport-plugin-reportuploader
        - librsvg2
        - linux-firmware
        - lldpad
        - lohit-assamese-fonts
        - lohit-bengali-fonts
        - lohit-devanagari-fonts
        - lohit-gujarati-fonts
        - lohit-gurmukhi-fonts
        - lohit-kannada-fonts
        - lohit-odia-fonts
        - lohit-tamil-fonts
        - lohit-telugu-fonts
        - lsof
        - madan-fonts
        - mtr
        - mt-st
        - net-tools
        - nfs-utils
        - nmap-ncat
        - nm-connection-editor
        - nss-tools
        - openssh-clients
        - openssh-server
        - ostree
        - pciutils
        - perl-interpreter
        - pigz
        - plymouth
        - prefixdevname
        - python3-pyatspi
        - rdma-core
        - realtek-firmware
        - rit-meera-new-fonts
        - rng-tools
        - rpcbind
        - rpm-ostree
        - rsync
        - rsyslog
        - selinux-policy-targeted
        - sg3_utils
        - sil-abyssinica-fonts
        - sil-padauk-fonts
        - sil-scheherazade-new-fonts
        - smartmontools
        - spice-vdagent
        - strace
        - systemd
        - tar
        - thai-scalable-waree-fonts
        - udisks2
        - udisks2-iscsi
        - usbutils
        - vim-minimal
        - volume_key
        - wget
        - xfsdump
        - xfsprogs
        - xorg-x11-drivers
        - xorg-x11-fonts-misc
        - xorg-x11-server-Xorg
        - xorg-x11-xauth
        - metacity
        - xrdb
        - xz
      conditions:
        grub common packages anaconda pkgs:
          when:
          # grub2 is used on all architectures, except s390x
            not_arch: s390x
          append:
            include:
              - grub2-tools
              - grub2-tools-extra
              - grub2-tools-minimal
        x86_64 specific anaconda pkgs:
          when:
            arch: x86_64
          append:
            include:
              - biosdevname
              - dmidecode
              - efibootmgr
              - grub2-tools-efi
              - memtest86+
        aarch64 specific anaconda pkgs:
          when:
            arch: aarch64
          append:
            include:
              - dmidecode
              - efibootmgr

    - include:
        - fedora-release-iot
platforms:
  - &x86_64_installer_platform
    <<:
      <<:
        arch: x86_64
        uefi_vendor: fedora
        qcow2_compat: '1.1'
        packages: &x86_64_uefi_platform_packages
          uefi:
            - dracut-config-generic
            - efibootmgr
            - grub2-efi-x64
            - shim-x64
        bootloader: grub2
      bios_platform: i386-pc
      packages: &x86_64_bios_platform_packages
        <<: *x86_64_uefi_platform_packages
        bios:
          - dracut-config-generic
          - grub2-pc
      build_packages:
        bios:
          - grub2-pc
      bootloader: grub2
    # XXX: the name is not 100% accurate, this platform is also used for iot-container, iot-commit
    image_format: raw
    packages: &x86_64_installer_platform_packages
      <<: *x86_64_bios_platform_packages
      booting:
        - biosdevname
        - grub2-pc-modules
        - grub2-tools-efi
        - grub2-tools
        - grub2-tools-extra
        - grub2-efi-ia32
        - grub2-efi-ia32-cdboot
        - shim-ia32
      firmware:
        - microcode_ctl
        - amd-gpu-firmware
        - amd-ucode-firmware
        - atheros-firmware
        - atmel-firmware
        - b43-openfwwf
        - brcmfmac-firmware
        - intel-gpu-firmware
        - iwlegacy-firmware
        - iwlwifi-dvm-firmware
        - iwlwifi-mvm-firmware
        - libertas-firmware
        - linux-firmware
        - mt7xxx-firmware
        - nvidia-gpu-firmware
        - nxpwireless-firmware
        - qed-firmware
        - realtek-firmware
        - tiwilink-firmware
    build_packages:
      booting:
        - shim-ia32
        - grub2-efi-ia32
        - grub2-efi-ia32-cdboot
    bootloader: grub2
    extra_uefi_architectures:
      - ia32
  - &aarch64_installer_platform
    arch: aarch64
    uefi_vendor: fedora
    packages: &aarch64_installer_platform_packages
      <<:
        uefi:
          - dracut-config-generic
          - efibootmgr
          - grub2-efi-aa64
          - grub2-tools
          - shim-aa64
      booting:
        - arm-image-installer
        - grub2-efi-aa64-cdboot
        - uboot-images-armv8
        - uboot-tools
      firmware:
        - amd-gpu-firmware
        - atheros-firmware
        - atmel-firmware
        - b43-openfwwf
        - bcm2711-firmware
        - bcm2835-firmware
        - bcm283x-firmware
        - brcmfmac-firmware
        - intel-gpu-firmware
        - iwlegacy-firmware
        - iwlwifi-dvm-firmware
        - iwlwifi-mvm-firmware
        - libertas-firmware
        - linux-firmware
        - mt7xxx-firmware
        - nvidia-gpu-firmware
        - nxpwireless-firmware
        - qcom-firmware
        - qed-firmware
        - realtek-firmware
        - tiwilink-firmware
    bootloader: grub2
platforms_override:
  conditions:
    Fedora 45 and up no longer have zd1211-firmware:
      when:
        version_less_than: '45'
      override:
        - <<: *x86_64_installer_platform
          packages:
            <<: *x86_64_installer_platform_packages
            compat:
              - zd1211-firmware
        - <<: *aarch64_installer_platform
          packages:
            <<: *aarch64_installer_platform_packages
            compat:
              - zd1211-firmware
blueprint:
  supported_options:
    - distro
    - customizations.installer
    - customizations.user
    - customizations.sshkey
    - customizations.group
    - customizations.fips
    - customizations.timezone
    - customizations.locale

