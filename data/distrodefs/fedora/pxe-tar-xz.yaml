filename: pxe.tar.xz
compression: xz
mime_type: application/x-tar
image_func: pxe_tar
exports: [xz]
bootable: true
package_sets:
  os:
    - include:
        - bash
        - coreutils
        - dracut-live
        - dracut-network
        - dracut-config-generic
            # gawk provides /usr/bin/awk which is a runtime dependency of
            # dracut's net-lib module. Without it, dracut fails to build the
            # initramfs with network support.
        - gawk
platforms:
  - <<:
      arch: x86_64
      uefi_vendor: fedora
      qcow2_compat: '1.1'
      packages: &x86_64_uefi_platform_packages
        uefi:
          - dracut-config-generic
          - efibootmgr
          - grub2-efi-x64
          - shim-x64
      bootloader: grub2
    bios_platform: i386-pc
    packages:
      <<: *x86_64_uefi_platform_packages
      bios:
        - dracut-config-generic
        - grub2-pc
    build_packages:
      bios:
        - grub2-pc
    bootloader: grub2
    # XXX: the name is not 100% accurate, this platform is also used for iot-container, iot-commit
  - arch: aarch64
    uefi_vendor: fedora
    image_format: qcow2
    qcow2_compat: '1.1'
    packages:
      uefi:
        - dracut-config-generic
        - efibootmgr
        - grub2-efi-aa64
        - grub2-tools
        - shim-aa64
    bootloader: grub2
blueprint:
  supported_options:
    - distro
    - packages
    - modules
    - groups
    - containers
    - customizations.cacerts
    - customizations.directories
    - customizations.files
    - customizations.fips
    - customizations.firewall
    - customizations.firstboot
    - customizations.user
    - customizations.sshkey
    - customizations.group
    - customizations.hostname
    - customizations.kernel
    - customizations.locale
    - customizations.openscap
    - customizations.repositories
    - customizations.rpm
    - customizations.services
    - customizations.timezone

