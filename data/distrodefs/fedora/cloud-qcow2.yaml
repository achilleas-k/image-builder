<<:
  bootable: true
  default_size: 5 GiB
  image_func: disk
  required_partition_sizes:
    /: 1 GiB
    /usr: 2 GiB

  partition_table:
    <<:
      x86_64:
        type: gpt
        partitions:
          - &cloud_partition_table_part_bios
            <<:
              size: 1 MiB
              bootable: true
              type: &bios_boot_partition_guid 
                21686148-6449-6E6F-744E-656564454649
            size: 2 MiB
          - &cloud_partition_table_part_efi
            <<:
              size: 200 MiB
              type: &efi_system_partition_guid 
                C12A7328-F81F-11D2-BA4B-00A0C93EC93B
              payload_type: filesystem
              payload:
                type: vfat
                mountpoint: /boot/efi
                label: ESP
                fstab_options: defaults,uid=0,gid=0,umask=077,shortname=winnt
                fstab_freq: 0
                fstab_passno: 2
            size: 100 MiB
          - &cloud_partition_table_part_boot
            <<:
              size: 2 GiB
              type: &filesystem_data_guid 0FC63DAF-8483-4772-8E79-3D69D8477DE4
              payload_type: filesystem
              payload: &default_partition_table_part_boot_payload
                type: ext4
                mountpoint: /boot
                label: boot
                fstab_options: defaults
                fstab_freq: 0
                fstab_passno: 0
            type: &xboot_ldr_partition_guid BC13C2FF-59E6-4262-A352-B275FD6F7172
            payload:
              <<: *default_partition_table_part_boot_payload
              type: ext4
          - <<: &cloud_partition_table_part_root
              payload_type: btrfs
              payload:
                subvolumes:
                  - name: root # @root=root XXX
                    mountpoint: /
                  - name: home
                    mountpoint: /home
              # XXX we want a parent and no mountpoint
                  - name: var
                    mountpoint: /var
              # XXX we want a parent and no mountpoint
            type: &root_partition_guid_x86_64 
              4f68bce3-e8cd-4db1-96e7-fbcaf984b709
      aarch64:
        type: gpt
        partitions:
          - *cloud_partition_table_part_efi
          - *cloud_partition_table_part_boot
          - <<: *cloud_partition_table_part_root
            type: &root_partition_guid_aarch64 
              b921b045-1df0-41c3-af44-4c6f280d3fae
      ppc64le:
        type: gpt
        partitions:
          - size: 8 MiB
            type: &prep_boot_partition_guid 21686148-6449-6E6F-744E-656564454649
          - *cloud_partition_table_part_boot
          - <<: *cloud_partition_table_part_root
            type: &root_partition_guid_ppc64le 
              c31c45e6-3f39-412e-80fb-4809c4980599
      s390x:
        type: dos
        partitions:
          - <<: *cloud_partition_table_part_boot
            type: &filesystem_linux_dosid '83'
          - <<: *cloud_partition_table_part_root
            type: *filesystem_linux_dosid

  partition_tables_override:
    conditions:
      f44 and up have /boot on btrfs:
        when:
          version_greater_or_equal: '44'
        override:
          x86_64:
            type: gpt
            partitions:
              - *cloud_partition_table_part_bios
              - *cloud_partition_table_part_efi
              - <<: &cloud_partition_table_part_root_with_boot_on_btrfs
                  payload_type: btrfs
                  payload:
                    subvolumes:
                      - name: root
                        mountpoint: /
                      - name: boot
                        mountpoint: /boot
                      - name: home
                        mountpoint: /home
                      - name: var
                        mountpoint: /var

                type: *root_partition_guid_x86_64
          aarch64:
            type: gpt
            partitions:
              - *cloud_partition_table_part_efi
              - <<: *cloud_partition_table_part_root_with_boot_on_btrfs
                type: *root_partition_guid_aarch64
          ppc64le:
            type: gpt
            partitions:
              - size: 8 MiB
                type: *prep_boot_partition_guid
              - <<: *cloud_partition_table_part_root_with_boot_on_btrfs
                type: *root_partition_guid_ppc64le
          s390x:
            type: dos
            partitions:
              - <<: *cloud_partition_table_part_boot
                type: *filesystem_linux_dosid
              - <<: *cloud_partition_table_part_root
                type: *filesystem_linux_dosid

  image_config: &cloud_base_image_config
    default_kernel: kernel-core
    kernel_options:
      - no_timer-check
      - console=tty1
      - console=ttyS0,115200n8
      - systemd.firstboot=off
  blueprint:
    supported_options:
      - distro
      - packages
      - modules
      - groups
      - enabled_modules
      - containers
      - customizations.cacerts
      - customizations.directories
      - customizations.disk
      - customizations.files
      - customizations.filesystem
      - customizations.firstboot
      - customizations.partitioning_mode
      - customizations.fips
      - customizations.firewall
      - customizations.user
      - customizations.sshkey
      - customizations.group
      - customizations.hostname
      - customizations.kernel
      - customizations.locale
      - customizations.openscap
      - customizations.repositories
      - customizations.rpm
      - customizations.services
      - customizations.timezone
      - customizations.sshd

    # options supported by base ostree image types (commit and container)
  platforms:
    - <<: &x86_64_bios_platform
        <<:
          arch: x86_64
          uefi_vendor: fedora
          qcow2_compat: '1.1'
          packages: &x86_64_uefi_platform_packages
            uefi:
              - dracut-config-generic
              - efibootmgr
              - grub2-efi-x64
              - shim-x64
          bootloader: grub2
        bios_platform: i386-pc
        packages:
          <<: *x86_64_uefi_platform_packages
          bios:
            - dracut-config-generic
            - grub2-pc
        build_packages:
          bios:
            - grub2-pc
        bootloader: grub2
    # XXX: the name is not 100% accurate, this platform is also used for iot-container, iot-commit
      image_format: raw
    - <<: &aarch64_platform
        arch: aarch64
        uefi_vendor: fedora
        image_format: qcow2
        qcow2_compat: '1.1'
        packages:
          uefi:
            - dracut-config-generic
            - efibootmgr
            - grub2-efi-aa64
            - grub2-tools
            - shim-aa64
        bootloader: grub2
      image_format: raw

filename: disk.qcow2
mime_type: application/x-qemu-disk
exports: [qcow2]
image_config:
  <<: *cloud_base_image_config
  conditions:
    f42 and below cloud init service names:
      when:
        version_less_than: '43'
      shallow_merge:
        enabled_services:
          - cloud-init.service
          - cloud-config.service
          - cloud-final.service
          - cloud-init-local.service

    f43 and above new cloud init service names:
      when:
        version_greater_or_equal: '43'
      shallow_merge:
        enabled_services:
          - cloud-init-network.service
          - cloud-config.service
          - cloud-final.service
          - cloud-init-local.service

package_sets:
  os:
    - include:
        - '@cloud-server-environment'
        - btrfs-progs
        - python3-dnf-plugin-tracer
        - glibc-langpack-en
      exclude:
        - dracut-config-rescue
        - firewalld
        - fwupd
        - '*-firmware'
        - geolite2-city
        - geolite2-country
        - plymouth
      # XXX we want to exclude kernel here
      # XXX so we get kernel-core?
      # XXX same for server

    - include:
        - qemu-guest-agent
platforms:
  - <<: *x86_64_bios_platform
    image_format: qcow2
  - <<: *aarch64_platform
    image_format: qcow2
  - <<:
      arch: ppc64le
      bios_platform: powerpc-ieee1275
      image_format: qcow2
      qcow2_compat: '1.1'
      packages:
        bios:
          - dracut-config-generic
          - powerpc-utils
          - grub2-ppc64le
          - grub2-ppc64le-modules
      build_packages:
        bios:
          - grub2-ppc64le
          - grub2-ppc64le-modules
      bootloader: grub2
    image_format: qcow2
  - <<:
      arch: s390x
      zipl_support: true
      image_format: qcow2
      qcow2_compat: '1.1'
      packages:
        zipl:
          - dracut-config-generic
          - s390utils-base
          - s390utils-core
      build_packages:
        zipl:
          - s390utils-base
      bootloader: zipl
    image_format: qcow2

