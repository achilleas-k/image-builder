<<:
  <<:
    supported_partitioning_modes:
      - ''  # empty string means default partitioning mode
      - auto-lvm
      - lvm

  filename: installer.iso
  mime_type: application/x-iso9660-image
  boot_iso: true
  image_func: ostree_installer
  ostree: &ostree_atomic
    name: fedora
    remote_name: fedora
    url: mirrorlist=https://ostree.fedoraproject.org/mirrorlist

  exports: [bootiso]
  required_partition_sizes:
    /: 1 GiB
    /usr: 2 GiB

  iso_config:
    <<:
      preparer: image-builder - https://osbuild.org/
      publisher: Fedora Project
      rootfs_type: squashfs
      rootfs_excludes:
        - boot/efi/.*
        - boot/grub2/.*
        - boot/config-.*
        - boot/initramfs-.*
        - boot/loader/.*
        - boot/symvers-.*
        - boot/System.map-.*

      conditions:
        x86_64 uses grub2:
          when:
            arch: x86_64
          shallow_merge:
            boot_type: grub2
        fedora 45 and up exclude efiboot.img on x86:
          when:
            version_greater_or_equal: '45'
            arch: x86_64
          shallow_merge:
            exclude_paths:
              - efiboot.img
        ppc64le uses grub2-ppc64le:
          when:
            arch: ppc64le
          shallow_merge:
            boot_type: grub2-ppc64le
        s390x uses s390-iso:
          when:
            arch: s390x
          shallow_merge:
            boot_type: s390-iso
        fedora < 45 excludes metadata:
          when:
            version_less_than: '45'
          shallow_merge:
            rootfs_excludes:
              - boot/efi/.*
              - boot/grub2/.*
              - boot/config-.*
              - boot/initramfs-.*
              - boot/loader/.*
              - boot/symvers-.*
              - boot/System.map-.*
              - usr/lib/sysimage/rpm/.*
              - var/lib/rpm/.*
              - var/lib/yum/.*
              - var/lib/dnf/.*

    rootfs_type: erofs
    erofs_options:
      compression:
        method: lzma
        level: 6
      options:
        - fragments
      cluster-size: 1048576

  installer_config:
    <<:
      enabled_anaconda_modules:
        - org.fedoraproject.Anaconda.Modules.Localization
        - org.fedoraproject.Anaconda.Modules.Network
        - org.fedoraproject.Anaconda.Modules.Payloads
        - org.fedoraproject.Anaconda.Modules.Runtime
        - org.fedoraproject.Anaconda.Modules.Storage
        - org.fedoraproject.Anaconda.Modules.Timezone
        - org.fedoraproject.Anaconda.Modules.Users
      additional_dracut_modules:
        - net-lib
        - dbus-broker
      default_menu: 1
      install_weak_deps: true
      conditions:
        below fedora 45 we use lorax:
          when:
            version_less_than: '45'
          shallow_merge:
            lorax_template_package: lorax-templates-generic
            lorax_templates:
              - path: 99-generic/runtime-postinstall.tmpl
              - path: 99-generic/runtime-cleanup.tmpl
                after_dracut: true
            lorax_logos_package: fedora-logos
            lorax_release_package: fedora-release


    install_weak_deps: false
    default_menu: 1
    iso_files:
      - [/usr/share/licenses/fedora-release-common/Fedora-Legal-README.txt, 
            /Fedora-Legal-README.txt]
      - [/usr/share/licenses/fedora-release-common/LICENSE, /LICENSE]
    payload:
      location: rootfs
      kickstart: interactive-defaults
  image_config:
    locale: en_US.UTF-8
    kernel_options:
  package_sets:
    installer:
      - &network_installer_pkgset
        include:
          - anaconda
          - anaconda-install-img-deps
          - ostree
          - rpm-ostree
          - pigz
          - audit
          - bind-utils
          - kernel
          - kernel-modules
          - kernel-modules-extra
          - grubby
          - glibc-all-langpacks
          - plymouth
          - anaconda-dracut
          - dracut-network
          - dracut-config-generic
          - initscripts
          - cryptsetup
          - rpcbind
          - kbd
          - kbd-misc
          - tar
          - xz
          - curl
          - bzip2
          - rsyslog
          - device-mapper-persistent-data
          - xfsdump
          - volume_key
          - nss-tools
          - selinux-policy-targeted
          - audit
          - ethtool
          - openssh-server
          - nfs-utils
          - openssh-clients
          - net-tools
          - bridge-utils
          - nmap-ncat
          - prefixdevname
          - pciutils
          - usbutils
          - ipmitool
          - mt-st
          - smartmontools
          - hdparm
          - rdma-core
          - rng-tools
          - nvme-cli
          - default-fonts-core-sans
          - default-fonts-other-sans
          - google-noto-sans-cjk-fonts
          - gdb-gdbserver
          - libreport-plugin-bugzilla
          - libreport-plugin-reportuploader
          - fpaste
          - python3-pyatspi
          - nano
          - nano-default-editor
          - vim-minimal
          - strace
          - lsof
          - dump
          - less
          - wget2-wget
          - rsync
          - bind-utils
          - ftp
          - mtr
          - vconfig
          - spice-vdagent
          - gdisk
          - hexedit
          - sg3_utils
        conditions:
          x86_64 specific anaconda pkgs:
            when:
              arch: x86_64
            append:
              include:
                - dmidecode
          aarch64 specific anaconda pkgs:
            when:
              arch: aarch64
            append:
              include:
                - dmidecode

  platforms:
    - &x86_64_installer_platform
      <<:
        <<:
          arch: x86_64
          uefi_vendor: fedora
          qcow2_compat: '1.1'
          packages: &x86_64_uefi_platform_packages
            uefi:
              - dracut-config-generic
              - efibootmgr
              - grub2-efi-x64
              - shim-x64
          bootloader: grub2
        bios_platform: i386-pc
        packages: &x86_64_bios_platform_packages
          <<: *x86_64_uefi_platform_packages
          bios:
            - dracut-config-generic
            - grub2-pc
        build_packages:
          bios:
            - grub2-pc
        bootloader: grub2
    # XXX: the name is not 100% accurate, this platform is also used for iot-container, iot-commit
      image_format: raw
      packages: &x86_64_installer_platform_packages
        <<: *x86_64_bios_platform_packages
        booting:
          - biosdevname
          - grub2-pc-modules
          - grub2-tools-efi
          - grub2-tools
          - grub2-tools-extra
          - grub2-efi-ia32
          - grub2-efi-ia32-cdboot
          - shim-ia32
        firmware:
          - microcode_ctl
          - amd-gpu-firmware
          - amd-ucode-firmware
          - atheros-firmware
          - atmel-firmware
          - b43-openfwwf
          - brcmfmac-firmware
          - intel-gpu-firmware
          - iwlegacy-firmware
          - iwlwifi-dvm-firmware
          - iwlwifi-mvm-firmware
          - libertas-firmware
          - linux-firmware
          - mt7xxx-firmware
          - nvidia-gpu-firmware
          - nxpwireless-firmware
          - qed-firmware
          - realtek-firmware
          - tiwilink-firmware
      build_packages:
        booting:
          - shim-ia32
          - grub2-efi-ia32
          - grub2-efi-ia32-cdboot
      bootloader: grub2
      extra_uefi_architectures:
        - ia32
    - &aarch64_installer_platform
      arch: aarch64
      uefi_vendor: fedora
      packages: &aarch64_installer_platform_packages
        <<:
          uefi:
            - dracut-config-generic
            - efibootmgr
            - grub2-efi-aa64
            - grub2-tools
            - shim-aa64
        booting:
          - arm-image-installer
          - grub2-efi-aa64-cdboot
          - uboot-images-armv8
          - uboot-tools
        firmware:
          - amd-gpu-firmware
          - atheros-firmware
          - atmel-firmware
          - b43-openfwwf
          - bcm2711-firmware
          - bcm2835-firmware
          - bcm283x-firmware
          - brcmfmac-firmware
          - intel-gpu-firmware
          - iwlegacy-firmware
          - iwlwifi-dvm-firmware
          - iwlwifi-mvm-firmware
          - libertas-firmware
          - linux-firmware
          - mt7xxx-firmware
          - nvidia-gpu-firmware
          - nxpwireless-firmware
          - qcom-firmware
          - qed-firmware
          - realtek-firmware
          - tiwilink-firmware
      bootloader: grub2
  platforms_override:
    conditions:
      Fedora 45 and up no longer have zd1211-firmware:
        when:
          version_less_than: '45'
        override:
          - <<: *x86_64_installer_platform
            packages:
              <<: *x86_64_installer_platform_packages
              compat:
                - zd1211-firmware
          - <<: *aarch64_installer_platform
            packages:
              <<: *aarch64_installer_platform_packages
              compat:
                - zd1211-firmware

  blueprint:
    supported_options:
      - distro
      - customizations.installer
      - customizations.user
      - customizations.sshkey
      - customizations.group
      - customizations.fips
      - customizations.timezone
      - customizations.locale

iso_label: Budgie-Atomic
variant: Budgie Atomic
ostree:
  <<: *ostree_atomic
  ref: '{{.Distro.Name}}/{{.Distro.MajorVersion}}/{{.Arch}}/onyx'
package_sets:
  installer:
    - *network_installer_pkgset
    - include:
        - fedora-release-budgie-atomic

