<<:
  supported_partitioning_modes:
    - ''    # empty string means default partitioning mode
    - auto-lvm
    - lvm

filename: simplified-installer.iso
mime_type: application/x-iso9660-image
bootable: true
boot_iso: true
default_size: 10 GiB
image_func: ostree_simplified_installer
iso_label: IoT
variant: IoT
ostree:
  <<:
    name: fedora-iot
    remote_name: fedora-iot
    ref: &ostree_iot_ref '{{.Distro.Name}}/{{.Distro.MajorVersion}}/{{.Arch}}/iot'
    url: mirrorlist=https://ostree.fedoraproject.org/iot/mirrorlist

  name: fedora
exports: [bootiso]
required_partition_sizes:
  /: 1 GiB
  /usr: 2 GiB

installer_config:
  <<:
    enabled_anaconda_modules:
      - org.fedoraproject.Anaconda.Modules.Localization
      - org.fedoraproject.Anaconda.Modules.Network
      - org.fedoraproject.Anaconda.Modules.Payloads
      - org.fedoraproject.Anaconda.Modules.Runtime
      - org.fedoraproject.Anaconda.Modules.Storage
      - org.fedoraproject.Anaconda.Modules.Timezone
      - org.fedoraproject.Anaconda.Modules.Users
    additional_dracut_modules:
      - net-lib
      - dbus-broker
    default_menu: 1
    install_weak_deps: true
    conditions:
      below fedora 45 we use lorax:
        when:
          version_less_than: '45'
        shallow_merge:
          lorax_template_package: lorax-templates-generic
          lorax_templates:
            - path: 99-generic/runtime-postinstall.tmpl
            - path: 99-generic/runtime-cleanup.tmpl
              after_dracut: true
          lorax_logos_package: fedora-logos
          lorax_release_package: fedora-release


  default_menu: 0
iso_config:
  boot_type: grub2-uefi
  conditions:
    x86_64 uses syslinux:
      when:
        arch: x86_64
      shallow_merge:
        boot_type: syslinux
image_config:
  <<:
    <<:
      enabled_services:
        - NetworkManager.service
        - firewalld.service
        - sshd.service
        - greenboot-grub2-set-counter
        - greenboot-grub2-set-success
        - greenboot-healthcheck
        - greenboot-rpm-ostree-grub2-check-fallback
        - greenboot-status
        - greenboot-task-runner
        - redboot-auto-reboot
        - redboot-task-runner
        - bootloader-update
      kernel_options:
        - rw
        - coreos.no_persist_ip

      conditions:
        f43 uses new greenboot:
          when:
            version_greater_or_equal: '43'
          shallow_merge:
            enabled_services:
              - NetworkManager.service
              - firewalld.service
              - sshd.service
              - greenboot-healthcheck
              - bootloader-update

    keyboard:
      keymap: us
    locale: C.UTF-8
    ostree_conf_sysroot_readonly: true
    lock_root_user: true

  ignition_platform: metal
partition_table:
  <<:
    x86_64: &iot_simplified_installer_partition_tables_x86
      uuid: D209C89E-EA5E-4FBD-B161-B461CCE297E0
      type: gpt
      partitions:
        - size: 501 MiB
          type: &efi_system_partition_guid C12A7328-F81F-11D2-BA4B-00A0C93EC93B
          payload_type: filesystem
          payload:
            type: vfat
            mountpoint: /boot/efi
            label: ESP
            fstab_options: umask=0077,shortname=winnt
            fstab_freq: 0
            fstab_passno: 2
        - size: 2 GiB
          type: &xboot_ldr_partition_guid BC13C2FF-59E6-4262-A352-B275FD6F7172
          payload_type: filesystem
          payload:
            type: ext4
            label: boot
            mountpoint: /boot
            fstab_options: defaults
            fstab_freq: 1
            fstab_passno: 1
        - type: &filesystem_data_guid 0FC63DAF-8483-4772-8E79-3D69D8477DE4
          payload_type: luks
          payload:
            label: crypt_root
            cipher: cipher_null
            passphrase: osbuild
            pbkdf:
              memory: 32
              iterations: 4
              parallelism: 1
            clevis:
              pin: 'null'
              policy: '{}'
              remove_passphrase: true
            payload_type: lvm
            payload:
              name: rootvg
              description: built with lvm2 and osbuild
              logical_volumes:
                - size: 8 GiB
                  name: rootlv
                  payload_type: filesystem
                  payload:
                    type: ext4
                    label: root
                    mountpoint: /
                    fstab_options: defaults,ro
                    fstab_freq: 0
                    fstab_passno: 0
    aarch64:
      <<: *iot_simplified_installer_partition_tables_x86
package_sets:
  installer:
    - include:
        - anaconda-dracut
        - atheros-firmware
        - attr
        - basesystem
        - binutils
        - brcmfmac-firmware
        - bsdtar
        - clevis-dracut
        - clevis-luks
        - cloud-utils-growpart
        - coreos-installer
        - coreos-installer-dracut
        - coreutils
        - curl
        - device-mapper-multipath
        - dosfstools
        - dracut-config-generic
        - dracut-live
        - dracut-network
        - e2fsprogs
        - fcoe-utils
        - fdo-init
        - fedora-logos
        - gdisk
        - gzip
        - hostname
        - ima-evm-utils
        - iproute
        - iptables
        - iputils
        - iscsi-initiator-utils
        - iwlwifi-dvm-firmware
        - iwlwifi-mvm-firmware
        - kernel
        - keyutils
        - less
        - linux-firmware
        - lldpad
        - lvm2
        - mdadm
        - nfs-utils
        - nss-softokn
        - openssh-clients
        - ostree
        - plymouth
        - policycoreutils
        - policycoreutils-python-utils
        - procps-ng
        - realtek-firmware
        - rng-tools
        - rootfiles
        - rpcbind
        - selinux-policy-targeted
        - setools-console
        - shadow-utils        # includes passwd
        - sudo
        - systemd
        - tar
        - traceroute
        - util-linux
        - xfsprogs
        - xz
platforms:
  - <<:
      arch: x86_64
      uefi_vendor: fedora
      qcow2_compat: '1.1'
      packages: &x86_64_uefi_platform_packages
        uefi:
          - dracut-config-generic
          - efibootmgr
          - grub2-efi-x64
          - shim-x64
      bootloader: grub2
    packages:
      <<: *x86_64_uefi_platform_packages
      firmware:
        - grub2-efi-x64
        - grub2-tools
        - grub2-tools-minimal
        - efibootmgr
        - shim-x64
        - brcmfmac-firmware
        - iwlwifi-dvm-firmware
        - iwlwifi-mvm-firmware
        - realtek-firmware
        - microcode_ctl
  - <<:
      arch: aarch64
      uefi_vendor: fedora
      packages:
        <<: &aarch64_uefi_platform_packages
          uefi:
            - dracut-config-generic
            - efibootmgr
            - grub2-efi-aa64
            - grub2-tools
            - shim-aa64
        booting:
          - arm-image-installer
          - grub2-efi-aa64-cdboot
          - uboot-images-armv8
          - uboot-tools
        firmware:
          - amd-gpu-firmware
          - atheros-firmware
          - atmel-firmware
          - b43-openfwwf
          - bcm2711-firmware
          - bcm2835-firmware
          - bcm283x-firmware
          - brcmfmac-firmware
          - intel-gpu-firmware
          - iwlegacy-firmware
          - iwlwifi-dvm-firmware
          - iwlwifi-mvm-firmware
          - libertas-firmware
          - linux-firmware
          - mt7xxx-firmware
          - nvidia-gpu-firmware
          - nxpwireless-firmware
          - qcom-firmware
          - qed-firmware
          - realtek-firmware
          - tiwilink-firmware
      bootloader: grub2
    packages:
      <<: *aarch64_uefi_platform_packages
      firmware:
        - arm-image-installer
        - bcm283x-firmware
        - grub2-efi-aa64
        - grub2-tools
        - grub2-tools-minimal
        - efibootmgr
        - shim-aa64
        - brcmfmac-firmware
        - iwlwifi-dvm-firmware
        - iwlwifi-mvm-firmware
        - realtek-firmware
        - uboot-images-armv8
blueprint:
  supported_options:
    - distro
    - customizations.installation_device
    - customizations.fdo
    - customizations.ignition
    - customizations.kernel
    - customizations.user
    - customizations.sshkey
    - customizations.group
    - customizations.fips
  required_options:
    - customizations.installation_device

  # Based on lorax runtime-install.tmpl
