---
distribution_name: "centos"
depsolver: "dnf"  # osbuild-depsolve-dnf
package_manager: "rpm"
uefi_vendor: "redhat"

system:
  default_oscap_datastream: "/usr/share/xml/scap/ssg/content/ssg-fedora-ds.xml"
  locale: "C.UTF-8"
  default_kernel: "kernel"
  update_default_kernel: true
  time:
    timezone: "UTC"

content:
  packages:
    install_weak_deps: true
    sets:
      eula:
        include:
          - "redhat-release-eula"
