---
distribution_name: "fedora"
depsolver: "dnf"  # osbuild-depsolve-dnf
package_manager: "rpm"
uefi_vendor: "fedora"

system:
  hostname: "localhost.localdomain"
  locale: "C.UTF-8"
  default_kernel: "kernel-core"
  update_default_kernel: true

  security:
    compliance:
      default_datastream: "/usr/share/xml/scap/ssg/content/ssg-fedora-ds.xml"

  systemd:
    machine_id_uninitialized: true

  time:
    timezone: "UTC"

content:
  rpms:
    options:
      install_weak_deps: true
