---
partitioning:
  required_partition_sizes:
    /: 1 GiB
    /usr: 2 GiB
  partition_table:
    type: dos
    partitions:
      # PReP
      - size: 4 MiB
        bootable: true
        type: '41'
      # root
      - size: 2 GiB
        payload_type: filesystem
        payload:
          type: xfs
          mountpoint: /
          fstab_options: defaults
          fstab_freq: 0
          fstab_passno: 0
