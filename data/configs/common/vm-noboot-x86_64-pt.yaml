---
partitioning:
  required_partition_sizes:
    /: 1 GiB
    /usr: 2 GiB
  partition_table:
    type: gpt
    partitions:
      - size: 1 MiB
        bootable: true
        type: 21686148-6449-6E6F-744E-656564454649
      # ESP
      - size: 200 MiB
        type: C12A7328-F81F-11D2-BA4B-00A0C93EC93B
        payload_type: filesystem
        payload:
          type: vfat
          mountpoint: /boot/efi
          label: ESP
          fstab_options: defaults,uid=0,gid=0,umask=077,shortname=winnt
          fstab_freq: 0
          fstab_passno: 2
      # root
      - size: 2 GiB
        type: 0FC63DAF-8483-4772-8E79-3D69D8477DE4
        payload_type: filesystem
        payload:
          type: xfs  # TODO: variable set by distro
          label: root
          mountpoint: /
          fstab_options: defaults
          fstab_freq: 0
          fstab_passno: 0
