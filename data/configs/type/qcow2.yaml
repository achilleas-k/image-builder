---
names: [qcow2, guest-image]
filename: disk.qcow2
mime_type: application/x-qemu-disk
bootable: true
default_size: 5 GiB
exports: [qcow2]

blueprint:
  supported_options:
    - distro
    - packages
    - modules
    - groups
    - enabled_modules
    - containers
    - customizations.cacerts
    - customizations.directories
    - customizations.disk
    - customizations.files
    - customizations.filesystem
    - customizations.firstboot
    - customizations.partitioning_mode
    - customizations.fips
    - customizations.firewall
    - customizations.user
    - customizations.sshkey
    - customizations.group
    - customizations.hostname
    - customizations.kernel
    - customizations.locale
    - customizations.openscap
    - customizations.repositories
    - customizations.rpm
    - customizations.services
    - customizations.timezone
    - customizations.sshd

content:
  packages:
    sets:
      os:
        include:
          - '@Fedora Cloud Server'
          - chrony
          - cloud-init
          - langpacks-en
          - qemu-guest-agent
          - qemu-guest-agent
        exclude:
          - dracut-config-rescue
          - firewalld
          - geolite2-city
          - geolite2-country
          - plymouth

system:
  kernel_options:
    - console=tty1
    - console=ttyS0,115200n8
    - earlyprintk=ttyS0
    - systemd.firstboot=off
  systemd:
    default_target: "multi-user.target"
    services:
      enable:
        - "cloud-init-network.service"
        - "cloud-config.service"
        - "cloud-final.service"
        - "cloud-init-local.service"

partition_table:
  required_partition_sizes:
    /: 1 GiB
    /usr: 2 GiB
  architecture:
    x86_64:
      uuid: D209C89E-EA5E-4FBD-B161-B461CCE297E0
      type: gpt
      partitions:
        - size: 1 MiB
          bootable: true
          type: &bios_boot_partition_guid 21686148-6449-6E6F-744E-656564454649
        - &default_partition_table_part_efi
          size: 200 MiB
          type: &efi_system_partition_guid C12A7328-F81F-11D2-BA4B-00A0C93EC93B
          payload_type: filesystem
          payload:
            type: vfat
            mountpoint: /boot/efi
            label: ESP
            fstab_options: defaults,uid=0,gid=0,umask=077,shortname=winnt
            fstab_freq: 0
            fstab_passno: 2
        - &default_partition_table_part_boot
          size: 2 GiB
          type: &filesystem_data_guid 0FC63DAF-8483-4772-8E79-3D69D8477DE4
          payload_type: filesystem
          payload:
            type: ext4
            mountpoint: /boot
            label: boot
            fstab_options: defaults
            fstab_freq: 0
            fstab_passno: 0
        - &default_partition_table_part_root
          size: 2 GiB
          type: *filesystem_data_guid
          payload_type: filesystem
          payload:
            type: ext4
            label: root
            mountpoint: /
            fstab_options: defaults
            fstab_freq: 0
            fstab_passno: 0
    aarch64: &default_partition_table_aarch64
      uuid: D209C89E-EA5E-4FBD-B161-B461CCE297E0
      type: gpt
      partitions:
        - *default_partition_table_part_efi
        - *default_partition_table_part_boot
        - *default_partition_table_part_root
    ppc64le:
      uuid: '0x14fc63d2'
      type: dos
      partitions:
        - size: 4 MiB
          bootable: true
          type: &prep_partition_dosid '41'
        - &default_partition_table_part_boot_ppc64le
          size: 2 GiB
          payload_type: filesystem
          payload:
            type: ext4
            mountpoint: /boot
            label: boot
            fstab_options: defaults
            fstab_freq: 0
            fstab_passno: 0
        - &default_partition_table_part_root_ppc64le
          size: 2 GiB
          payload_type: filesystem
          payload:
            type: ext4
            mountpoint: /
            fstab_options: defaults
            fstab_freq: 0
            fstab_passno: 0
    s390x:
      uuid: '0x14fc63d2'
      type: dos
      partitions:
        - *default_partition_table_part_boot_ppc64le
        - <<: *default_partition_table_part_root_ppc64le
          bootable: true
    riscv64: *default_partition_table_aarch64
