---
names: [qcow2, guest-image]
filename: disk.qcow2
mime_type: application/x-qemu-disk
bootable: true
default_size: 5 GiB
exports: [qcow2]

content:
  packages:
    sets:
      os:
        include:
          - '@Fedora Cloud Server'
          - chrony
          - cloud-init
          - langpacks-en
          - qemu-guest-agent
          - qemu-guest-agent  # matching existing config - will delete
        exclude:
          - dracut-config-rescue
          - firewalld
          - geolite2-city
          - geolite2-country
          - plymouth

system:
  kernel_options:
    - console=tty1
    - console=ttyS0,115200n8
    - earlyprintk=ttyS0
    - systemd.firstboot=off
  systemd:
    default_target: "multi-user.target"
