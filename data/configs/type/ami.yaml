---
names: ["ami", "aws"]
filename: image.raw
mime_type: application/octet-stream
bootable: true
default_size: 5 GiB
exports: [image]

content:
  packages:
    sets:
      os:
        include:
          - '@Fedora Cloud Server'
          - chrony
          - cloud-init
          - langpacks-en
          - qemu-guest-agent
        exclude:
          - dracut-config-rescue
          - firewalld
          - geolite2-city
          - geolite2-country
          - plymouth

system:
  kernel_options:
    - console=tty1
    - console=ttyS0,115200n8
    - earlyprintk=ttyS0
    - systemd.firstboot=off
  systemd:
    default_target: "multi-user.target"
