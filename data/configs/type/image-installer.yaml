          # "oscap-anaconda-addon"
          - "ostree"
          - "pciutils"
          - "perl-interpreter"
          - "pigz"
          - "plymouth"
          - "prefixdevname"
          - "python3-pyatspi"
          - "rdma-core"
          - "rng-tools"
          - "rpcbind"
          - "rpm-ostree"
          - "rsync"
          - "rsyslog"
          - "selinux-policy-targeted"
          - "sg3_utils"
          - "sil-padauk-fonts"
