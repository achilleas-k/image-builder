          - "spice-vdagent"
          - "strace"
          - "systemd"
          - "tar"
          - "udisks2"
          - "udisks2-iscsi"
          - "usbutils"
          - "vim-minimal"
          - "volume_key"
          - "wget"
          - "xfsdump"
          - "xfsprogs"
          - "xz"
          # Extra packages that are required by the dracut stage of all installers.
          # These are weak deps of other packages in the list above, but lets be
          # explicit about what we need and not rely on the weak deps. Relying
          # on hard-dependencies for other modules is OK for now.
          #
          # TODO: add these dynamically based on the modules enabled by each
          # pipeline.
          - "mdadm"
          - "nss-softokn"
      os:
        include:
          - "@core"
          - chrony
          - cockpit-system
          - cockpit-ws
          - dnf-utils
          - dosfstools
          - firewalld
          - iwl1000-firmware
          - iwl100-firmware
          - iwl105-firmware
          - iwl135-firmware
          - iwl2000-firmware
          - iwl2030-firmware
          - iwl3160-firmware
          - iwl5000-firmware
          - iwl5150-firmware
          - iwl6000g2a-firmware
          - iwl6000g2b-firmware
          - iwl6050-firmware
          - iwl7260-firmware
          - lvm2
          - net-tools
          - nfs-utils
          - oddjob
          - oddjob-mkhomedir
          - policycoreutils
          - psmisc
          - python3-jsonschema
          - qemu-guest-agent
          - redhat-release
          - rsync
          - tar
          - tcpdump
          - tuned
        exclude:
          - dracut-config-rescue
          - firewalld
          - geolite2-city
          - geolite2-country
          - plymouth

system:
  kernel_options:
    - console=tty1
    - console=ttyS0,115200n8
    - earlyprintk=ttyS0
    - systemd.firstboot=off
  systemd:
    default_target: "multi-user.target"

  time:
    ntp_servers:
    leapsectz: null
