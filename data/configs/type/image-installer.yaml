          # TODO: x86_64 only
          - "biosdevname"
          - "dmidecode"
          - "memtest86+"
      os:
        include:
          - "@core"
          - chrony
          - cockpit-system
          - cockpit-ws
          - dnf-utils
          - dosfstools
          - firewalld
          - iwl1000-firmware
          - iwl100-firmware
          - iwl105-firmware
          - iwl135-firmware
          - iwl2000-firmware
          - iwl2030-firmware
          - iwl3160-firmware
          - iwl5000-firmware
          - iwl5150-firmware
          - iwl6000g2a-firmware
          - iwl6000g2b-firmware
          - iwl6050-firmware
          - iwl7260-firmware
          - lvm2
          - net-tools
          - nfs-utils
          - oddjob
          - oddjob-mkhomedir
          - policycoreutils
          - psmisc
          - python3-jsonschema
          - qemu-guest-agent
          - redhat-release
          - rsync
          - tar
          - tcpdump
          - tuned
        exclude:
          - dracut-config-rescue
          - firewalld
          - geolite2-city
          - geolite2-country
          - plymouth

system:
  systemd:

  time:
    ntp_servers:
    leapsectz: null

  network:
    enabled: true
    no_zero_conf: true
