---
names: [image-installer]
filename: installer.iso
mime_type: application/x-iso9660-image
bootable: true
exports: [bootiso]
function: "image-installer"

iso:
  label: "CentOS-Stream-10-BaseOS-x86_64"
  rootfs:
    type: "squashfs"
    excludes:
      - "boot/efi/.*"
      - "boot/grub2/.*"
      - "boot/config-.*"
      - "boot/initramfs-.*"
      - "boot/loader/.*"
      - "boot/symvers-.*"
      - "boot/System.map-.*"
      - "usr/lib/sysimage/rpm/.*"
      - "var/lib/rpm/.*"
      - "var/lib/yum/.*"
      - "var/lib/dnf/.*"
  grub2:
    default_menu_entry: 1
  boot_type: "grub2"

installer:
  anaconda:
    enabled_modules:
      - "org.fedoraproject.Anaconda.Modules.Network"
      - "org.fedoraproject.Anaconda.Modules.Payloads"
      - "org.fedoraproject.Anaconda.Modules.Runtime"
      - "org.fedoraproject.Anaconda.Modules.Storage"
  dracut:
    add_modules:
      - "nvdimm"  # non-volatile DIMM firmware (provides nfit, cuse, and nd_e820)
      - "net-lib"
    add_drivers:
      - "ipmi_devintf"
      - "ipmi_msghandler"
  lorax:
    logos_package: redhat-logos
    release_package: redhat-release
    template_package: lorax-templates-rhel
    templates:
      - path: 80-rhel/runtime-postinstall.tmpl
      - path: 80-rhel/runtime-cleanup.tmpl
        after_dracut: true

content:
  packages:  # TODO: should only describe OS / payload packages
    sets:
      installer:  # TODO: move under installer!
        # NOTE: Moving installer packages under the installer section of the config gives us a few benefits:
        #   - Package set names can be arbitrary.  No more magic strings!
        #   - The location of the package set (content, installer, etc)
        #   determines its purpose (pipeline).
        #   - The package set names are there to aide in the merging of lists,
        #   functionally speaking.  But they can also serve as a way to trace
        #   the source component of each set of packages.  Like tagging the
        #   origin of each package name that ends up in the OS or installer.
        #   - It also makes it nicer to have named package sets that can be
        #   overridden.  For example, imagine the distro-wide component defines
        #   the default release package for all images in the distribution.  So
        #   every image config that uses that gets a package set called
        #   'release' in the 'content' block.  But if a specific image type
        #   wants to override it, it can simply redefine the 'release' package
        #   set inside the 'content' block, instead of adding it to the 'os'
        #   package set.  This does mean that package set names become
        #   meaningful, but the meaning is limited within the collection of
        #   yaml components that define it.  The semantics of the package set
        #   names does not leak from a collection of config components (yaml
        #   files) into the pipeline generators (the "core logic" in code).
        include:
          - "anaconda-dracut"
          - "curl"
          - "dracut-config-generic"
          - "dracut-network"
          - "hostname"
          - "iwl100-firmware"
          - "iwl1000-firmware"
          - "iwl105-firmware"
          - "iwl135-firmware"
          - "iwl2000-firmware"
          - "iwl2030-firmware"
          - "iwl3160-firmware"
          - "iwl5000-firmware"
          - "iwl5150-firmware"
          - "iwl6050-firmware"
          - "iwl7260-firmware"
          - "kernel"
          - "less"
          - "nfs-utils"
          - "openssh-clients"
          - "ostree"
          - "plymouth"
          - "prefixdevname"
          - "rng-tools"
          - "rpcbind"
          - "selinux-policy-targeted"
          - "systemd"
          - "tar"
          - "xfsprogs"
          - "xz"
          - "@hardware-support"
          - "alsa-firmware"
          - "alsa-tools-firmware"
          - "anaconda"
          - "anaconda-dracut"
          - "anaconda-install-img-deps"
          - "anaconda-widgets"
          - "audit"
          - "bind-utils"
