          - "gnome-kiosk"
          - "google-noto-sans-cjk-ttc-fonts"
          - "grubby"
          - "gsettings-desktop-schemas"
          - "hdparm"
          - "hexedit"
          - "hostname"
          - "initscripts"
          - "ipmitool"
          - "iwl1000-firmware"
          - "iwl100-firmware"
          - "iwl105-firmware"
          - "iwl135-firmware"
          - "iwl2000-firmware"
