---
names: [image-installer]
filename: installer.iso
mime_type: application/x-iso9660-image
bootable: true
exports: [bootiso]
function: "image-installer"

iso:
  label: "Unkown"

installer:
  anaconda:
    enabled_modules:
      - "org.fedoraproject.Anaconda.Modules.Network"
      - "org.fedoraproject.Anaconda.Modules.Payloads"
      - "org.fedoraproject.Anaconda.Modules.Runtime"
      - "org.fedoraproject.Anaconda.Modules.Storage"
  dracut:
    add_modules:
      - "nvdimm"  # non-volatile DIMM firmware (provides nfit, cuse, and nd_e820)
      - "net-lib"
    add_drivers:
      - "ipmi_devintf"
      - "ipmi_msghandler"
  lorax:
    logos_package: redhat-logos
    release_package: redhat-release
    template_package: lorax-templates-rhel
    templates:
      - path: 80-rhel/runtime-postinstall.tmpl
      - path: 80-rhel/runtime-cleanup.tmpl
        after_dracut: true

content:
  packages:
    sets:
      installer:
        include:
          - "anaconda-dracut"
          - "curl"
          - "dracut-config-generic"
          - "dracut-network"
          - "hostname"
          - "iwl100-firmware"
          - "iwl1000-firmware"
          - "iwl105-firmware"
          - "iwl135-firmware"
          - "iwl2000-firmware"
          - "iwl2030-firmware"
          - "iwl3160-firmware"
          - "iwl5000-firmware"
          - "iwl5150-firmware"
          - "iwl6050-firmware"
          - "iwl7260-firmware"
          - "kernel"
          - "less"
          - "nfs-utils"
          - "openssh-clients"
          - "ostree"
          - "plymouth"
          - "prefixdevname"
          - "rng-tools"
          - "rpcbind"
          - "selinux-policy-targeted"
          - "systemd"
          - "tar"
          - "xfsprogs"
          - "xz"
          - "@hardware-support"
          - "alsa-firmware"
          - "alsa-tools-firmware"
          - "anaconda"
          - "anaconda-dracut"
          - "anaconda-install-img-deps"
          - "anaconda-widgets"
          - "audit"
          - "bind-utils"
          - "bzip2"
          - "cryptsetup"
          - "curl"
          - "dbus-x11"
          - "default-fonts-core-sans"
          - "default-fonts-other-sans"
          - "dejavu-sans-fonts"
          - "dejavu-sans-mono-fonts"
          - "device-mapper-persistent-data"
          - "dnf"
          - "dracut-config-generic"
          - "dracut-network"
          - "ethtool"
          - "fcoe-utils"
          - "ftp"
          - "gdb-gdbserver"
          - "glibc-all-langpacks"
          - "gnome-kiosk"
          - "google-noto-sans-cjk-ttc-fonts"
          - "grubby"
          - "gsettings-desktop-schemas"
          - "hdparm"
          - "hexedit"
          - "hostname"
          - "initscripts"
          - "ipmitool"
          - "iwl1000-firmware"
          - "iwl100-firmware"
          - "iwl105-firmware"
          - "iwl135-firmware"
          - "iwl2000-firmware"
          - "iwl2030-firmware"
          - "iwl3160-firmware"
          - "iwl5000-firmware"
          - "iwl5150-firmware"
          - "iwl6000g2a-firmware"
          - "iwl6000g2b-firmware"
          - "iwl6050-firmware"
          - "iwl7260-firmware"
          - "jomolhari-fonts"
          - "kbd"
          - "kbd-misc"
          - "kdump-anaconda-addon"
          - "kernel"
          - "less"
          - "libblockdev-lvm-dbus"
          - "libibverbs"
          - "librsvg2"
          - "linux-firmware"
          - "lldpad"
          - "lsof"
